name: Secret scan

on:
  pull_request:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the tracked tree with redacted output
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$scan_dir"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$scan_dir" --redact --no-banner
